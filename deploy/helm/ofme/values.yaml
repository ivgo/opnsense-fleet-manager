# =============================================================================
# Default values for the OFME Helm chart.
#
# The chart deploys stateless components only. Provide PostgreSQL, Redis and
# S3/MinIO (managed services or operators) and point the URLs below at them.
# =============================================================================

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []
image:
  api:
    repository: ghcr.io/ofme/ofme-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/ofme/ofme-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# --------------------------------------------------------------------- API
api:
  replicaCount: 2
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: api

# --------------------------------------------------------------------- workers
worker:
  replicaCount: 2
  concurrency: 4
  maxTasksPerChild: 500
  podAnnotations: {}
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: null
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# --------------------------------------------------------------------- scheduler
beat:
  replicaCount: 1
  storage: 128Mi
  storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 384Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------- console
frontend:
  replicaCount: 2
  podAnnotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------- grpc
# Internal read-only inventory API (ofme.fleet.v1.FleetRegistry). Disabled by
# default: no port is opened until `enabled` is true *and* the
# GRPC_SERVICE_TOKEN key exists in the application secret.
grpc:
  enabled: false
  port: 50051
  bind: 0.0.0.0:50051

# --------------------------------------------------------------------- ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: ofme.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: api
        - path: /ws
          pathType: Prefix
          service: api
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: ofme-tls
      hosts:
        - ofme.example.com

# --------------------------------------------------------------------- runtime configuration
config:
  ENVIRONMENT: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  ENABLE_DOCS: "false"
  ALLOWED_HOSTS: ofme.example.com
  CORS_ORIGINS: https://ofme.example.com
  # Ingress controller / load-balancer CIDRs whose X-Forwarded-* headers are trusted.
  TRUSTED_PROXY_IPS: 10.0.0.0/8
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "600"
  RATE_LIMIT_AUTH_REQUESTS: "20"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  PASSWORD_MIN_LENGTH: "12"
  LOGIN_MAX_FAILURES: "5"
  LOGIN_LOCK_MINUTES: "15"
  ENABLE_MFA: "true"
  MFA_ISSUER: OFME
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_RECYCLE_SECONDS: "1800"
  S3_REGION: us-east-1
  S3_USE_SSL: "true"
  S3_BUCKET_BACKUPS: ofme-backups
  S3_BUCKET_ARTIFACTS: ofme-artifacts
  # Empty for the bundled MinIO (no KMS); set AES256 / aws:kms for managed S3.
  S3_SERVER_SIDE_ENCRYPTION: ""
  PKI_CA_CERT_PATH: /etc/ofme/pki/ca.crt
  PKI_CA_KEY_PATH: /etc/ofme/pki/ca.key
  PKI_DEVICE_VALIDITY_DAYS: "365"
  PKI_RENEW_BEFORE_DAYS: "30"
  PKI_KEY_SIZE: "3072"
  ENROLLMENT_TOKEN_TTL_MINUTES: "60"
  HEARTBEAT_INTERVAL_SECONDS: "60"
  DEVICE_OFFLINE_AFTER_SECONDS: "180"
  METRIC_RETENTION_DAYS: "90"
  AUDIT_RETENTION_DAYS: "2555"
  WEBHOOK_TIMEOUT_SECONDS: "15"
  OPNsense_TIMEOUT_SECONDS: "20"
  OPNsense_VERIFY_TLS: "true"
  DEFAULT_TENANT_SLUG: default
  BOOTSTRAP_ADMIN_EMAIL: admin@example.com
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  OTEL_SERVICE_NAME: ofme-api
  GRPC_ENABLED: "false"
  GRPC_BIND: 0.0.0.0:50051
  WAIT_FOR_DB: "true"
  RUN_MIGRATIONS: "true"

# Secret keys expected by the API/worker:
#   SECRET_KEY, DATABASE_URL, REDIS_URL, CELERY_BROKER_URL,
#   CELERY_RESULT_BACKEND, S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY,
#   BOOTSTRAP_ADMIN_PASSWORD (optional)
secrets:
  existingSecret: ofme-secrets
  create: false
  stringData: {}

# CA material shared by API and workers. Generate with backend/scripts/init_pki.py.
pki:
  existingSecret: ofme-pki
  create: false
  cert: ""
  key: ""

# Optional references to observability components (set to false when unused).
otel:
  enabled: true

# --------------------------------------------------------------------- scheduling helpers
nodeSelector: {}
tolerations: []
affinity: {}
