apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ofme.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ofme.labels" . | nindent 4 }}
    app.kubernetes.io/component: configuration
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
