{{- if .Values.pki.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pki.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ofme.labels" . | nindent 4 }}
    app.kubernetes.io/component: pki
type: Opaque
stringData:
  ca.crt: |
    {{- .Values.pki.cert | nindent 4 }}
  ca.key: |
    {{- .Values.pki.key | nindent 4 }}
{{- end }}
