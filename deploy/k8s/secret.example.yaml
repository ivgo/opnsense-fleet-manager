# Template only - never commit real values.
#
#   kubectl -n ofme create secret generic ofme-secrets \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://ofme:<password>@ofme-postgres:5432/ofme' \
#     --from-literal=REDIS_URL='redis://ofme-redis:6379/0' \
#     --from-literal=CELERY_BROKER_URL='redis://ofme-redis:6379/1' \
#     --from-literal=CELERY_RESULT_BACKEND='redis://ofme-redis:6379/2' \
#     --from-literal=S3_ACCESS_KEY='<access-key>' \
#     --from-literal=S3_SECRET_KEY='<secret-key>' \
#     --from-literal=BOOTSTRAP_ADMIN_PASSWORD='<one-time-password>'
#
# The PKI secret is created by backend/scripts/init_pki.py --kubectl-secret.
apiVersion: v1
kind: Secret
metadata:
  name: ofme-secrets
  namespace: ofme
  labels:
    app.kubernetes.io/name: ofme
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  SECRET_KEY: CHANGE_ME_48_RANDOM_CHARACTERS
  POSTGRES_PASSWORD: CHANGE_ME_same_as_database_url
  DATABASE_URL: postgresql+asyncpg://ofme:CHANGE_ME_same_as_postgres_password@ofme-postgres:5432/ofme
  REDIS_URL: redis://ofme-redis:6379/0
  CELERY_BROKER_URL: redis://ofme-redis:6379/1
  CELERY_RESULT_BACKEND: redis://ofme-redis:6379/2
  S3_ENDPOINT: https://s3.example.com
  S3_ACCESS_KEY: CHANGE_ME
  S3_SECRET_KEY: CHANGE_ME
  BOOTSTRAP_ADMIN_PASSWORD: ""
  # Only needed when GRPC_ENABLED=true.
  GRPC_SERVICE_TOKEN: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ofme-pki
  namespace: ofme
  labels:
    app.kubernetes.io/name: ofme
    app.kubernetes.io/component: pki
type: Opaque
stringData:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME
    -----END CERTIFICATE-----
  ca.key: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME
    -----END PRIVATE KEY-----
