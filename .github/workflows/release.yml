name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (for example 1.0.0)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish images and release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalise image owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/ofme-api
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: SPA image metadata
        id: spa-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/ofme-frontend
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push SPA
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.spa-meta.outputs.tags }}
          labels: ${{ steps.spa-meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Package the OPNsense plugin sources
        run: |
          mkdir -p dist
          tar -czf "dist/os-fleet-agent-${GITHUB_REF_NAME}.tar.gz" -C plugin os-fleet-agent
          sha256sum "dist/os-fleet-agent-${GITHUB_REF_NAME}.tar.gz" > "dist/os-fleet-agent-${GITHUB_REF_NAME}.sha256"

      - name: Generate the OpenAPI document
        working-directory: backend
        env:
          ENVIRONMENT: production
          SECRET_KEY: release-only-secret-key-0123456789abcdef0123456789
          S3_ENDPOINT: http://127.0.0.1:9
          OTEL_ENABLED: "false"
        run: |
          python -m pip install --upgrade pip
          pip install .
          python scripts/export_openapi.py --output ../api/openapi.json

      - name: Attach assets to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/os-fleet-agent-*.tar.gz
            dist/os-fleet-agent-*.sha256
            api/openapi.json

  helm:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Package chart
        run: helm package deploy/helm/ofme --destination dist
      - name: Push chart to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/ofme-*.tgz oci://ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/charts
