name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  TEST_DATABASE_URL: postgresql+asyncpg://ofme:ofme@127.0.0.1:55432/ofme_test

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ofme
          POSTGRES_PASSWORD: ofme
          POSTGRES_DB: ofme_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U ofme -d ofme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Create virtualenv and install
        working-directory: backend
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: .venv/bin/ruff check app tests

      - name: Ruff format check
        working-directory: backend
        run: .venv/bin/ruff format --check app tests

      - name: mypy
        # Static typing is advisory: the runtime contract is covered by pytest.
        continue-on-error: true
        working-directory: backend
        run: .venv/bin/mypy app

      - name: Import the application and build the OpenAPI document
        working-directory: backend
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
          S3_ENDPOINT: http://127.0.0.1:9
          OTEL_ENABLED: "false"
        run: |
          .venv/bin/python -c "
          from app.main import app
          spec = app.openapi()
          assert len(spec['paths']) >= 150, len(spec['paths'])
          print('paths', len(spec['paths']), 'schemas', len(spec['components']['schemas']))
          "

      - name: Alembic migration round-trip
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://ofme:ofme@127.0.0.1:55432/ofme_test
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head

      - name: Pytest
        working-directory: backend
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
          S3_ENDPOINT: http://127.0.0.1:9
          OTEL_ENABLED: "false"
        run: .venv/bin/python -m pytest tests -q --cov=app --cov-report=xml --junitxml=junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/coverage.xml
            backend/junit.xml
          retention-days: 14

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test

      - name: Production build
        env:
          VITE_API_BASE_URL: ""
          VITE_WS_BASE_URL: ""
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  plugin:
    name: OPNsense plugin (PHP lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint every PHP file
        run: |
          find plugin/os-fleet-agent -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate XML
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          find plugin/os-fleet-agent -name '*.xml' -print0 | xargs -0 -n1 xmllint --noout

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: ofme/api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build SPA image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: ofme/frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  manifests:
    name: Kubernetes and Helm validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4

      - name: helm lint
        run: helm lint deploy/helm/ofme

      - name: helm template
        run: helm template ofme deploy/helm/ofme --namespace ofme > /tmp/rendered.yaml

      - name: kubectl client validation
        run: kubectl apply --dry-run=client -f /tmp/rendered.yaml -f deploy/k8s/namespace.yaml

      - name: promtool check
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus" \
            --entrypoint promtool prom/prometheus:v3.1.0 \
            check config /etc/prometheus/prometheus.yml
