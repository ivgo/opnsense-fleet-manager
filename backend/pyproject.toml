[project]
name = "ofme-backend"
version = "1.0.0"
description = "OPNsense Fleet Manager Enterprise - backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "greenlet==3.1.1",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "argon2-cffi==23.1.0",
    "pyjwt[crypto]==2.10.1",
    "pyotp==2.9.0",
    "cryptography==44.0.0",
    "boto3==1.35.86",
    "python-multipart==0.0.20",
    "jinja2==3.1.5",
    "pyyaml==6.0.2",
    "jsonschema==4.23.0",
    "ldap3==2.9.1",
    "authlib==1.4.0",
    "grpcio==1.69.0",
    "grpcio-tools==1.69.0",
    "protobuf==5.29.2",
    "prometheus-client==0.21.1",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-exporter-otlp-proto-http==1.29.0",
    "structlog==24.4.0",
    "orjson==3.10.13",
    "tenacity==9.0.0",
    "python-dateutil==2.9.0.post0",
    "croniter==6.0.0",
    "reportlab==4.2.5",
    "lxml==5.3.0",
    "signxml==4.2.2",
    "pyopenssl>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "aiosqlite==0.20.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "types-pyyaml==6.0.12.20241230",
    "testcontainers[postgres,redis]==4.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py313"
# Generated files are reproduced byte-for-byte by their generators; linting them
# only produces noise that must never be "fixed" by hand.
exclude = [
    "alembic/versions",
    "app/grpc/generated",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# `app/grpc` would otherwise make the third-party `grpc` package look first-party.
detect-same-package = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
# S105/S106: placeholder secrets and OAuth "token_type" strings are not credentials.
# S108: /tmp defaults are development placeholders overridden in production.
# ASYNC109: explicit timeouts are forwarded to httpx/asyncio, not ignored.
ignore = ["S101", "B008", "S105", "S106", "S108", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# The test bootstrap must set environment variables before importing the app.
"tests/conftest.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
