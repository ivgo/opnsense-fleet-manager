# pgBackRest configuration — local filesystem backup repository
# All options can be overridden via PGBACKREST_* environment variables

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
repo1-type=posix
compress-type=gz
compress-level=3
archive-async=n
process-max=4
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail
start-fast=y
stop-auto=y

[global:backup]
process-max=4

[global:restore]
process-max=8

[ofme]
# Local PostgreSQL data directory (mounted from postgres container)
# No pg1-host = no SSH required, works locally
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
pg1-database=ofme