server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5s
      max_retries: 10

scrape_configs:
  # Container stdout/stderr (the API and workers log structured JSON to stdout).
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            event: event
            request_id: request_id
      - labels:
          level:
          logger:
          event:
      - structured_metadata:
          request_id:

  # Rotated files written by host-level deployments (systemd, Kubernetes sidecars).
  - job_name: ofme-files
    static_configs:
      - targets: ["localhost"]
        labels:
          job: ofme-files
          __path__: /var/log/ofme/**/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            event: event
      - labels:
          level:
          logger:
          event:
