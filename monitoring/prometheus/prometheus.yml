global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: ofme
    environment: development   # override per deployment with `promtool`/Helm values

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI exposes the default Prometheus registry on /metrics.
  - job_name: ofme-api
    metrics_path: /metrics
    static_configs:
      - targets: ["ofme-api:8000"]
        labels:
          service: ofme-api
          component: api

  # Celery workers and beats export OTLP metrics; the collector re-exposes the
  # Prometheus exposition format on :9464 when OTEL_ENABLED=true.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
        labels:
          service: ofme-worker

  # The collector exposes its own internal telemetry (queue depth, dropped
  # spans, exporter errors) on :8888 in the Prometheus exposition format.
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics
    scrape_interval: 60s

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
    metrics_path: /metrics
    scrape_interval: 60s
