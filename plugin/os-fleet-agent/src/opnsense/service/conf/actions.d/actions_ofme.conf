[start]
command:/usr/local/etc/rc.d/os-fleet-agent onestart
parameters:
type:script
message:start OFME Fleet Agent

[stop]
command:/usr/local/etc/rc.d/os-fleet-agent onestop
parameters:
type:script
message:stop OFME Fleet Agent

[restart]
command:/usr/local/etc/rc.d/os-fleet-agent onerestart
parameters:
type:script
message:restart OFME Fleet Agent

[status]
command:/usr/local/etc/rc.d/os-fleet-agent onestatus
parameters:
type:script_output
message:OFME Fleet Agent service status

[agent.enroll]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php enroll
parameters:
type:script_output
message:enroll the firewall with OFME
timeout:180

[agent.renew]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php renew
parameters:
type:script_output
message:renew the OFME device certificate
timeout:180

[agent.preview]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php preview
parameters:
type:script_output
message:preview the OFME desired configuration
timeout:300

[agent.sync]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php sync --force
parameters:
type:script_output
message:synchronise the OFME desired configuration
timeout:600

[agent.status]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php status
parameters:
type:script_output
message:OFME Fleet Agent status

[agent.log]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php log %s
parameters:%s
type:script_output
message:read the OFME Fleet Agent log

[agent.import-ca]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php import-ca %s
parameters:%s
type:script_output
message:import the OFME platform CA
timeout:60

[agent.test]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php test
parameters:
type:script_output
message:test OFME platform connectivity
timeout:60

[agent.diagnostics]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php diagnostics
parameters:
type:script_output
message:collect OFME Fleet Agent diagnostics
timeout:120

[agent.reset]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php reset
parameters:
type:script_output
message:reset the OFME device enrollment
timeout:60

[agent.command]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/FleetAgent/agent.php command %s
parameters:%s
type:script_output
message:run a whitelisted OFME Fleet Agent command
timeout:600
