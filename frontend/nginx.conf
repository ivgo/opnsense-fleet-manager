# Docker's embedded DNS (127.0.0.11) with a short TTL. Without this resolver,
# nginx resolves `ofme-api` once at config load and caches the IP forever, so a
# recreated API container (new IP) is unreachable until the container restarts.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 32m;

    # NOTE: nginx drops every inherited add_header as soon as a location declares
    # its own add_header. Keep the security headers in this server block only and
    # use `expires` (which is not affected by that rule) for per-location caching.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP with nonce support (requires dynamic nonce injection - see deploy/scripts/generate-csp-nonce.sh)
    # 'unsafe-inline' for style-src is needed for Emotion (MUI) runtime style injection
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location /api/ {
        set $api_upstream http://ofme-api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location /ws {
        set $ws_upstream http://ofme-api:8000;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
