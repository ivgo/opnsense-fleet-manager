# Main nginx configuration for the OFME SPA image.
#
# The stock `nginx.conf` from the base image writes its pid to `/var/run`,
# which is a tmpfs owned by root at runtime; the container runs as the
# unprivileged `ofme` user, so the default file cannot be created. The pid and
# the temporary paths therefore live under `/tmp`, and both logs go to the
# container streams (collected by Promtail / the platform log driver).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    include /etc/nginx/conf.d/*.conf;
}
