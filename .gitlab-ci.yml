# =============================================================================
# GitLab CI/CD pipeline for OPNsense Fleet Manager Enterprise
#
# Required CI/CD variables:
#   SECRET_KEY                  random 48+ character string (masked)
#   CI_REGISTRY_*               provided by GitLab when the registry is enabled
#   KUBE_CONTEXT / KUBE_CONFIG  protected variables for the deploy stage
# =============================================================================

stages:
  - lint
  - test
  - build
  - security
  - deploy

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

variables:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  POSTGRES_DB: ofme_test
  POSTGRES_USER: ofme
  POSTGRES_PASSWORD: ofme
  TEST_DATABASE_URL: postgresql+asyncpg://ofme:ofme@postgres:5432/ofme_test
  DATABASE_URL: postgresql+asyncpg://ofme:ofme@postgres:5432/ofme_test
  SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789
  S3_ENDPOINT: http://127.0.0.1:9
  OTEL_ENABLED: "false"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# --------------------------------------------------------------------- templates
.python:
  image: python:3.13-slim
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential libldap2-dev libsasl2-dev libssl-dev
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install -e "backend[dev]"
  cache:
    key: "py-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
  artifacts:
    when: always
    expire_in: 14 days

.node:
  image: node:22-alpine
  cache:
    key: "node-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/npm

# --------------------------------------------------------------------- lint
backend:lint:
  extends: .python
  stage: lint
  script:
    - ruff check backend/app backend/tests
    - ruff format --check backend/app backend/tests
  allow_failure: false

frontend:lint:
  extends: .node
  stage: lint
  script:
    - cd frontend
    - npm ci --cache "$npm_config_cache" --prefer-offline
    - npm run lint
    - npx tsc --noEmit

plugin:lint:
  stage: lint
  image: php:8.2-cli
  script:
    - find plugin/os-fleet-agent -name '*.php' -print0 | xargs -0 -n1 php -l

# --------------------------------------------------------------------- test
backend:test:
  extends: .python
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  script:
    - cd backend
    - alembic upgrade head
    - alembic downgrade base
    - alembic upgrade head
    - pytest tests -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    reports:
      junit: backend/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml

frontend:test:
  extends: .node
  stage: test
  script:
    - cd frontend
    - npm ci --cache "$npm_config_cache" --prefer-offline
    - npm run test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/coverage

# --------------------------------------------------------------------- build
build:api:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [backend:test]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/api:latest" backend
    - docker push "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/api:latest"

build:spa:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  needs: [frontend:test]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --pull -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/frontend:latest" frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"

build:openapi:
  extends: .python
  stage: build
  needs: [backend:test]
  script:
    - cd backend
    - python scripts/export_openapi.py --output ../api/openapi.json
  artifacts:
    paths:
      - api/openapi.json
    expire_in: 30 days

# --------------------------------------------------------------------- security
security:dependencies:
  extends: .python
  stage: security
  script:
    - pip install --quiet pip-audit
    - pip-audit --desc --skip-editable
  allow_failure: true

security:images:
  stage: security
  image: aquasec/trivy:0.58.1
  needs: [build:api, build:spa]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/api:$CI_COMMIT_SHA"
    - trivy image --exit-code 0 --severity HIGH,CRITICAL "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
  allow_failure: true

# --------------------------------------------------------------------- deploy
deploy:staging:
  stage: deploy
  image: alpine/helm:3.16.4
  needs: [build:api, build:spa]
  environment:
    name: staging
    url: https://ofme-staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - helm upgrade --install ofme deploy/helm/ofme
        --namespace ofme-staging --create-namespace
        --set image.api.repository="$CI_REGISTRY_IMAGE/api"
        --set image.api.tag="$CI_COMMIT_SHA"
        --set image.frontend.repository="$CI_REGISTRY_IMAGE/frontend"
        --set image.frontend.tag="$CI_COMMIT_SHA"
        --set ingress.hosts[0].host=ofme-staging.example.com
        --wait --timeout 10m

deploy:production:
  stage: deploy
  image: alpine/helm:3.16.4
  needs: [build:api, build:spa]
  environment:
    name: production
    url: https://ofme.example.com
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  script:
    - helm upgrade --install ofme deploy/helm/ofme
        --namespace ofme --create-namespace
        --set image.api.repository="$CI_REGISTRY_IMAGE/api"
        --set image.api.tag="$CI_COMMIT_TAG"
        --set image.frontend.repository="$CI_REGISTRY_IMAGE/frontend"
        --set image.frontend.tag="$CI_COMMIT_TAG"
        --set ingress.hosts[0].host=ofme.example.com
        --wait --timeout 15m
