# PostgreSQL configuration for OPNsense Fleet Manager Enterprise
# Enables WAL archiving for pgBackRest.

# WAL archiving
archive_mode = on
archive_command = 'test -f /var/lib/pgbackrest/archive/%f || cp %p /var/lib/pgbackrest/archive/%f'
archive_timeout = 60000

# WAL settings
wal_level = replica
max_wal_senders = 10
wal_keep_size = 1024

# Connection settings
listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'

# Autovacuum
autovacuum = on

# Shared buffers
shared_buffers = '128MB'