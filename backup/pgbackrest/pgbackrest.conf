# pgBackRest configuration — local filesystem backup repository
# This runs inside the postgres container, so pg1-path points to local data dir

[global]
repo1-path=/var/lib/pgbackrest
spool-path=/var/spool/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
repo1-type=posix
compress-type=gz
compress-level=3
archive-async=n
process-max=4
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail
start-fast=y
stop-auto=y

[global:backup]
process-max=4

[global:restore]
process-max=8

[ofme]
# Local PostgreSQL data directory - no SSH required
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=ofme
pg1-database=ofme