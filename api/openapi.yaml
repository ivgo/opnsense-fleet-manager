openapi: 3.1.0
info:
  title: OPNsense Fleet Manager Enterprise
  description: 'Centralised management plane for OPNsense fleets: inventory, configuration, policy-as-code, SD-WAN,
    zero-touch provisioning, compliance and audit.'
  contact:
    name: OFME Platform Team
    email: platform@ofme.io
  license:
    name: Commercial
    url: https://ofme.local/licensing
  version: 1.0.0
paths:
  /api/v1/health/live:
    get:
      tags:
      - Health
      summary: Process liveness
      operationId: live_api_v1_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Live Api V1 Health Live Get
  /api/v1/health/startup:
    get:
      tags:
      - Health
      summary: Startup probe
      operationId: startup_api_v1_health_startup_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Startup Api V1 Health Startup Get
  /api/v1/health/ready:
    get:
      tags:
      - Health
      summary: Dependency readiness
      operationId: ready_api_v1_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/health/version:
    get:
      tags:
      - Health
      summary: Build metadata
      operationId: version_api_v1_health_version_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Password login (with optional TOTP)
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/ldap/login:
    post:
      tags:
      - Authentication
      summary: LDAP / Active Directory login
      operationId: ldap_login_api_v1_auth_ldap_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LdapLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/mfa/verify:
    post:
      tags:
      - Authentication
      summary: Complete an MFA challenge
      operationId: verify_mfa_api_v1_auth_mfa_verify_post
      parameters:
      - name: challenge_token
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Challenge Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate refresh token
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
