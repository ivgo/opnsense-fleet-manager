      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/mfa/setup:
    post:
      tags:
      - Authentication
      summary: Start TOTP enrolment
      operationId: setup_mfa_api_v1_auth_mfa_setup_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetupResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/mfa/verify-setup:
    post:
      tags:
      - Authentication
      summary: Confirm TOTP enrolment
      operationId: verify_mfa_setup_api_v1_auth_mfa_verify_setup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/mfa/disable:
    post:
      tags:
      - Authentication
      summary: Disable TOTP
      operationId: disable_mfa_api_v1_auth_mfa_disable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/sessions:
    get:
      tags:
      - Authentication
