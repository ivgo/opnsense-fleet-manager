                $ref: '#/components/schemas/TenantOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Tenants
      summary: Soft-delete a tenant
      operationId: delete_tenant_api_v1_tenants__tenant_id__delete
