tags:
- name: Health
  description: Liveness, readiness and build metadata.
- name: Authentication
  description: Login, MFA, SSO and token lifecycle.
- name: Tenants
  description: Multi-tenant administration (SuperAdmin only).
- name: Users
  description: Identity, roles, permissions and API keys.
- name: Sites
  description: Physical/logical site inventory.
- name: Groups
  description: Device groups and policy inheritance.
- name: Devices
  description: Firewall inventory, credentials and PKI.
- name: Configuration
  description: Desired-state configuration for devices.
- name: Firewall rules
  description: Rule CRUD and ordering.
- name: Aliases
  description: Alias definitions.
- name: NAT
  description: NAT/port-forward rules.
- name: Interfaces
  description: Interfaces, routes and VLANs.
- name: DHCP
  description: DHCP scopes and static reservations.
- name: DNS
  description: Authoritative DNS records for managed resolvers.
- name: Templates
  description: Configuration templates.
- name: Policies
  description: Policy-as-code, deployments and drift.
- name: GitOps
  description: Repository integrations and webhooks.
- name: SD-WAN
  description: Topologies, tunnels, links and traffic policies.
- name: Zero-touch provisioning
  description: Enrollment tokens and bootstrap.
- name: Backups
  description: Signed configuration backups and restore.
- name: Jobs
  description: Background job control.
- name: Scheduled tasks
  description: Tenant-owned cron schedules.
- name: Alerts
  description: Alert lifecycle and alert rules.
- name: Notifications
  description: In-app notification inbox.
- name: Monitoring
  description: Fleet dashboard, health and metric series.
- name: Audit
  description: Immutable audit trail and event replay.
- name: Compliance
  description: CIS, ISO 27001, NIS2, PCI DSS and SOC 2 reporting.
- name: Device agent
  description: mTLS-authenticated endpoints used by os-fleet-agent.
