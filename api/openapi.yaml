          - type: string
          - type: 'null'
          title: Tenant
      - name: entra
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Entra
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcAuthorizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/oidc/callback:
